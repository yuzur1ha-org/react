name: quality
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec vitest run
      - run: pnpm exec playwright install --with-deps chromium webkit
        if: matrix.node == 24
      - run: pnpm exec playwright test --project=docs:* --project=docs-content:* --project=docs-polish:* --project=press:ssg
        if: matrix.node == 24
      - run: pnpm --filter @yuzur1ha/docs build && pnpm exec playwright test --project=docs-production:* --project=docs-polish-production:*
        if: matrix.node == 24
      - run: pnpm --filter @yuzur1ha/docs build
        if: matrix.node == 26
      - run: pnpm exec playwright test --project=pages
        if: matrix.node == 24
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failure-node-${{ matrix.node }}
          path: |
            test-results
            playwright-report
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
