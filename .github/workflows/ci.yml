name: ci
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full browser and Windows suites
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changeset:
    outputs:
      version-pr: ${{ steps.policy.outputs.version-pr }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from "origin/${{ github.base_ref || 'main' }}" --to HEAD
      - run: node scripts/check-changeset.mjs
        id: policy
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
  quality:
    needs: changeset
    if: needs.changeset.outputs.version-pr != 'true' || inputs.full
    uses: ./.github/workflows/quality.yml
    with:
      full: ${{ inputs.full || false }}
  packages:
    needs: changeset
    if: needs.changeset.outputs.version-pr == 'true' && !inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter "./packages/*" --if-present typecheck
      - run: pnpm --filter "./packages/*" pack --pack-destination "$RUNNER_TEMP/packages"
